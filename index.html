<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chalk</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg-hard:#1d2021;
  --bg:     #282828;
  --bg1:    #3c3836;
  --bg2:    #504945;
  --bg3:    #665c54;
  --bg4:    #7c6f64;
  --fg:     #ebdbb2;
  --fg0:    #fbf1c7;
  --fg2:    #d5c4a1;
  --fg3:    #bdae93;
  --fg4:    #a89984;
  --red:    #fb4934;
  --green:  #b8bb26;
  --yellow: #fabd2f;
  --blue:   #83a598;
  --purple: #d3869b;
  --aqua:   #8ec07c;
  --orange: #fe8019;
}

html,body{height:100%}

body{
  background:var(--bg-hard);
  color:var(--fg);
  font-family:'JetBrains Mono',monospace;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ── TOPBAR ── */
#topbar{
  position:sticky;top:0;z-index:300;
  background:var(--bg);
  border-bottom:1px solid var(--bg1);
  height:46px;
  display:flex;align-items:center;
  padding:0 1.75rem;
  gap:0;
  user-select:none;
}
.logo{
  font-family:'Syne',sans-serif;
  font-weight:800;font-size:1.1rem;
  color:var(--yellow);
  letter-spacing:-0.02em;
  margin-right:1.5rem;
}
.nav-sep{width:1px;height:20px;background:var(--bg2);margin-right:0.5rem}
.nav-btn{
  background:none;border:none;
  color:var(--fg4);
  font-family:'JetBrains Mono',monospace;
  font-size:0.72rem;letter-spacing:0.03em;
  padding:5px 9px;border-radius:4px;
  cursor:pointer;transition:background .1s,color .1s;
  white-space:nowrap;
}
.nav-btn:hover{background:var(--bg1);color:var(--fg)}
.spacer{flex:1}
#new-btn{
  display:flex;align-items:center;gap:5px;
  background:var(--bg1);border:none;border-radius:5px;
  color:var(--fg3);
  font-family:'JetBrains Mono',monospace;
  font-size:0.7rem;letter-spacing:0.04em;
  padding:5px 13px;cursor:pointer;
  transition:background .12s,color .12s;
}
#new-btn:hover{background:var(--bg2);color:var(--yellow)}
#new-btn svg{flex-shrink:0}

/* ── NOTEBOOK ── */
#notebook{
  flex:1;
  max-width:820px;width:100%;
  margin:0 auto;
  padding:1.8rem 1.25rem 5rem;
  display:flex;flex-direction:column;
  gap:0;
}

/* ── EMPTY HINT ── */
#empty-hint{
  display:none;
  text-align:center;
  margin-top:4rem;
  color:var(--bg3);
  font-size:0.75rem;font-style:italic;
  letter-spacing:0.04em;line-height:2.2;
  pointer-events:none;
}
#empty-hint kbd{
  background:var(--bg1);color:var(--fg4);
  border:1px solid var(--bg3);border-radius:3px;
  padding:1px 6px;font-size:0.68rem;
  font-family:'JetBrains Mono',monospace;
}

/* ── ADD ZONE ── */
.add-zone{
  height:10px;position:relative;
  display:flex;align-items:center;
  margin-left:48px;
  opacity:0;transition:opacity .15s;
  cursor:pointer;
}
.add-zone:hover{opacity:1!important}
.add-zone::before,.add-zone::after{
  content:'';flex:1;height:1px;background:var(--bg2);
}
.add-zone-label{
  font-size:0.58rem;color:var(--bg3);
  padding:0 8px;background:var(--bg-hard);
  white-space:nowrap;transition:color .1s;
}
.add-zone:hover .add-zone-label{color:var(--fg4)}
.cell:hover+.add-zone,.add-zone:hover,.add-zone+.cell:hover{opacity:1}

/* ── DROP INDICATOR ── */
.drop-indicator{
  height:3px;background:var(--yellow);
  border-radius:2px;margin-left:48px;
  opacity:0;transition:opacity .1s;
  pointer-events:none;
}
.drop-indicator.visible{opacity:1}

/* ── CELL ── */
.cell{
  display:flex;flex-direction:row;
  position:relative;
  margin-bottom:2px;
  transition:opacity .15s, transform .15s;
}
.cell.dragging{
  opacity:.35;
}
.cell.drag-over-above .cell-inner{
  box-shadow:0 -2px 0 0 var(--yellow);
}
.cell.drag-over-below .cell-inner{
  box-shadow:0 2px 0 0 var(--yellow);
}

/* accent per position */
.cell[data-accent="0"]{--ac:var(--yellow)}
.cell[data-accent="1"]{--ac:var(--blue)}
.cell[data-accent="2"]{--ac:var(--aqua)}
.cell[data-accent="3"]{--ac:var(--orange)}
.cell[data-accent="4"]{--ac:var(--purple)}
.cell[data-accent="5"]{--ac:var(--green)}
.cell[data-accent="6"]{--ac:var(--red)}

/* ── GUTTER ── */
.gutter{
  width:48px;flex-shrink:0;
  display:flex;flex-direction:column;
  align-items:center;
  padding-top:11px;gap:7px;
}
.cell-num{
  font-size:0.62rem;color:var(--bg3);
  min-width:26px;text-align:right;
  line-height:1;transition:color .12s;
  white-space:nowrap;
}
.cell.active .cell-num{color:var(--fg4)}

/* drag handle */
.drag-handle{
  display:flex;flex-direction:column;
  gap:2.5px;align-items:center;
  padding:3px 4px;border-radius:3px;
  cursor:grab;transition:background .1s;
  touch-action:none;
}
.drag-handle:active{cursor:grabbing}
.drag-handle span{
  width:9px;height:1.5px;
  background:var(--bg2);border-radius:2px;
  display:block;transition:background .1s;
}
.cell:hover .drag-handle span{background:var(--bg4)}
.drag-handle:hover{background:var(--bg1)}
.drag-handle:hover span{background:var(--fg4)}

/* ── CELL INNER ── */
.cell-inner{
  flex:1;min-width:0;
  background:var(--bg);
  border:1px solid transparent;
  border-radius:6px;
  position:relative;
  transition:border-color .12s, box-shadow .12s;
}
.cell:hover .cell-inner{border-color:var(--bg2)}
.cell.active .cell-inner{
  border-color:var(--bg3);
  border-left:3px solid var(--ac,var(--blue));
}

/* ── TEXTAREA ── */
.cell-area{
  display:block;width:100%;
  background:transparent;
  border:none;outline:none;resize:none;
  overflow:hidden;
  color:var(--fg0);
  font-family:'JetBrains Mono',monospace;
  font-size:0.93rem;font-weight:400;
  line-height:1.85;
  padding:11px 15px 11px 13px;
  min-height:48px;
  caret-color:var(--ac,var(--yellow));
  tab-size:2;
}
.cell-area::placeholder{
  color:var(--bg3);font-style:italic;
  font-weight:300;font-size:0.82rem;
}
.cell-area::-webkit-scrollbar{display:none}

/* ── CELL TOOLBAR ── */
.cell-toolbar{
  position:absolute;top:5px;right:7px;
  display:flex;gap:2px;
  opacity:0;pointer-events:none;
  transition:opacity .1s;
}
.cell:hover .cell-toolbar,
.cell.active .cell-toolbar{opacity:1;pointer-events:all}
.tb{
  background:var(--bg1);border:none;
  border-radius:3px;color:var(--fg4);
  font-family:'JetBrains Mono',monospace;
  font-size:0.58rem;padding:3px 6px;
  cursor:pointer;letter-spacing:.03em;
  transition:background .1s,color .1s;
  white-space:nowrap;line-height:1.4;
}
.tb:hover{background:var(--bg2);color:var(--fg)}
.tb.up:hover,.tb.dn:hover{color:var(--yellow)}
.tb.rm:hover{color:var(--red)}
.cell-wc{
  font-size:0.55rem;color:var(--bg3);
  letter-spacing:.05em;padding:3px 5px;
  white-space:nowrap;line-height:1.4;
  pointer-events:none;
  transition:color .1s;
}
.cell:hover .cell-wc,.cell.active .cell-wc{color:var(--bg4)}

/* ── BOTTOM BAR ── */
#bottom{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg);
  border-top:1px solid var(--bg1);
  height:38px;z-index:300;
  display:flex;align-items:center;
  padding:0 1.75rem;gap:0;
}
.hint-group{
  display:flex;align-items:center;gap:8px;
  padding:0 1.2rem;
  border-right:1px solid var(--bg1);
  height:100%;
}
.hint-group:first-child{padding-left:0}
.hint{
  display:flex;align-items:center;gap:3px;
  font-size:0.6rem;color:var(--bg4);
  letter-spacing:.03em;white-space:nowrap;
}
.hint-label{
  font-size:0.6rem;color:var(--bg3);
  letter-spacing:.05em;white-space:nowrap;
  margin-left:2px;
}
kbd{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--bg1);
  color:var(--fg3);
  border:1px solid var(--bg2);
  border-bottom:2px solid var(--bg3);
  border-radius:4px;
  padding:1px 6px;min-width:20px;
  font-family:'JetBrains Mono',monospace;
  font-size:0.58rem;line-height:1.7;
  white-space:nowrap;
}
.plus{color:var(--bg3);font-size:0.55rem;margin:0 1px}
#cell-count{
  margin-left:auto;
  font-size:0.6rem;color:var(--bg3);
  letter-spacing:.08em;
  padding-left:1.2rem;
  border-left:1px solid var(--bg1);
  height:100%;display:flex;align-items:center;
}

/* ── ANIMATIONS ── */
@keyframes slide-in{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}
.cell-new{animation:slide-in .16s ease forwards}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">chalk</div>
  <div class="nav-sep"></div>
  <button class="nav-btn" onclick="clearAll()">clear all</button>
  <button class="nav-btn" onclick="exportTxt()">export</button>
  <div class="spacer"></div>
  <button id="new-btn" onclick="addCell(null,true)">
    <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
      <line x1="5.5" y1="1" x2="5.5" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="1" y1="5.5" x2="10" y2="5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    new cell
  </button>
</div>

<div id="notebook">
  <div id="empty-hint">
    press <kbd>b</kbd> or click<br>
    <span style="color:var(--bg2)">— — —</span><br>
    to add your first cell
  </div>
</div>

<div id="bottom">
  <div class="hint-group">
    <span class="hint"><kbd>shift</kbd><span class="plus">+</span><kbd>↵</kbd></span>
    <span class="hint-label">next cell</span>
  </div>
  <div class="hint-group">
    <span class="hint"><kbd>ctrl</kbd><span class="plus">+</span><kbd>↵</kbd></span>
    <span class="hint-label">new below</span>
  </div>
  <div class="hint-group">
    <span class="hint"><kbd>b</kbd></span>
    <span class="hint-label">new cell</span>
  </div>
  <div class="hint-group">
    <span class="hint"><kbd>⌫</kbd></span>
    <span class="hint-label">delete if empty</span>
  </div>
  <div class="hint-group">
    <span class="hint"><kbd>↑</kbd><kbd>↓</kbd></span>
    <span class="hint-label">move cell</span>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:0;height:100%">
    <span id="cell-count" style="font-size:.6rem;color:var(--bg3);letter-spacing:.08em;padding:0 1.2rem;border-left:1px solid var(--bg1);height:100%;display:flex;align-items:center;">0 cells</span>
    <span id="total-words" style="font-size:.6rem;color:var(--bg3);letter-spacing:.08em;padding:0 1.2rem;border-left:1px solid var(--bg1);height:100%;display:flex;align-items:center;">0 words</span>
  </div>
</div>

<script>
const ALLOWED = /[a-z0-9 \n\t+\-*\/=<>%^()[\]{}.,'?]/;
const ACCENTS = 7;

let cells    = [];
let nextId   = 1;
let activeId = null;

// drag state
let dragId      = null;
let dragOverId  = null;
let dragPos     = null; // 'above' | 'below'

const nb       = document.getElementById('notebook');
const emptyEl  = document.getElementById('empty-hint');
const countEl  = document.getElementById('cell-count');

/* ── STORAGE ── */
function save() {
  localStorage.setItem('chalk-v2', JSON.stringify({cells, nextId}));
}
function load() {
  try {
    const r = localStorage.getItem('chalk-v2');
    if (r) {
      const d = JSON.parse(r);
      if (d.cells && d.cells.length) {
        cells = d.cells;
        nextId = d.nextId || cells.length + 1;
        renderAll();
        return;
      }
    }
  } catch(e){}
  // fresh start — 3 blank cells
  cells = [{id:1,content:''},{id:2,content:''},{id:3,content:''}];
  nextId = 4;
  renderAll();
}

/* ── TEXT FILTER ── */
function clean(raw) {
  let out = '';
  for (let i = 0; i < raw.length; i++) {
    const ch = raw[i];
    if (ALLOWED.test(ch)) { out += ch; continue; }
    if (ch >= 'A' && ch <= 'Z') { out += ch.toLowerCase(); continue; }
  }
  return out;
}

/* ── ADD CELL ── */
function addCell(afterId=null, animate=false, content='', fid=null) {
  const id = fid ?? nextId++;
  const item = {id, content: clean(content)};
  let idx = cells.length;
  if (afterId !== null) {
    const i = cells.findIndex(c => c.id === afterId);
    if (i !== -1) idx = i + 1;
  }
  cells.splice(idx, 0, item);
  renderAll();
  save();
  requestAnimationFrame(() => {
    const ta = nb.querySelector(`.cell-area[data-id="${id}"]`);
    if (!ta) return;
    if (animate) ta.closest('.cell').classList.add('cell-new');
    ta.focus();
  });
  return id;
}

/* ── DELETE CELL ── */
function delCell(id) {
  if (cells.length <= 1) {
    const ta = nb.querySelector(`.cell-area[data-id="${id}"]`);
    if (ta) { ta.value=''; handleInput(ta,id); }
    return;
  }
  const idx = cells.findIndex(c => c.id === id);
  cells.splice(idx, 1);
  renderAll();
  save();
  requestAnimationFrame(() => {
    const fi = Math.min(idx, cells.length-1);
    const ta = nb.querySelector(`.cell-area[data-id="${cells[fi].id}"]`);
    if (ta) ta.focus();
  });
}

/* ── MOVE CELL ── */
function moveCell(id, dir) {
  const idx = cells.findIndex(c => c.id === id);
  const t   = idx + dir;
  if (t < 0 || t >= cells.length) return;
  [cells[idx], cells[t]] = [cells[t], cells[idx]];
  renderAll();
  save();
  requestAnimationFrame(() => {
    const ta = nb.querySelector(`.cell-area[data-id="${id}"]`);
    if (ta) ta.focus();
  });
}

/* ── INPUT HANDLER ── */
function handleInput(ta, id) {
  const item = cells.find(c => c.id === id);
  if (!item) return;
  const filtered = clean(ta.value);
  if (ta.value !== filtered) {
    const s = ta.selectionStart;
    ta.value = filtered;
    ta.selectionStart = ta.selectionEnd = Math.min(s, filtered.length);
  }
  item.content = filtered;
  save();
  resize(ta);
  updateCount();
}

function resize(ta) {
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}

/* ── RENDER ALL ── */
function renderAll() {
  nb.innerHTML = '';
  emptyEl.style.display = cells.length ? 'none' : 'block';
  if (!cells.length) { nb.appendChild(emptyEl); updateCount(); return; }

  nb.appendChild(emptyEl);

  cells.forEach((c, idx) => {
    if (idx === 0) nb.appendChild(mkZone(null));
    nb.appendChild(mkCell(c, idx));
    nb.appendChild(mkZone(c.id));
  });

  requestAnimationFrame(() => {
    cells.forEach(c => {
      const ta = nb.querySelector(`.cell-area[data-id="${c.id}"]`);
      if (!ta) return;
      ta.value = c.content;
      resize(ta);
    });
    updateCount();
  });
}

/* ── MAKE ADD ZONE ── */
function mkZone(afterId) {
  const z = document.createElement('div');
  z.className = 'add-zone';
  z.innerHTML = `<span class="add-zone-label">+ cell</span>`;
  z.addEventListener('click', () => addCell(afterId, true));
  return z;
}

/* ── MAKE CELL ── */
function mkCell(c, idx) {
  const wrap = document.createElement('div');
  wrap.className = 'cell' + (activeId === c.id ? ' active' : '');
  wrap.dataset.id = c.id;
  wrap.dataset.accent = idx % ACCENTS;

  wrap.innerHTML = `
    <div class="gutter">
      <span class="cell-num">[${idx+1}]</span>
      <div class="drag-handle" title="drag to reorder">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="cell-inner">
      <textarea class="cell-area" data-id="${c.id}" placeholder="write anything..." rows="1" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      <div class="cell-toolbar">
        <span class="cell-wc" data-wc="${c.id}">0w</span>
        <button class="tb up" onclick="moveCell(${c.id},-1)">↑</button>
        <button class="tb dn" onclick="moveCell(${c.id}, 1)">↓</button>
        <button class="tb rm" onclick="delCell(${c.id})">✕</button>
      </div>
    </div>`;

  const ta     = wrap.querySelector('.cell-area');
  const handle = wrap.querySelector('.drag-handle');

  /* input */
  ta.addEventListener('input', () => handleInput(ta, c.id));

  /* keydown */
  ta.addEventListener('keydown', e => {
    // silent lowercase conversion for caps
    if (e.key.length === 1 && e.key >= 'A' && e.key <= 'Z' && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      insertAt(ta, e.key.toLowerCase(), c.id);
      return;
    }
    // block disallowed symbols
    const blocked = '!@#$&|\\;:"`~_';
    if (e.key.length === 1 && blocked.includes(e.key)) { e.preventDefault(); return; }

    // Shift+Enter → next cell (create if last)
    if (e.key === 'Enter' && e.shiftKey) {
      e.preventDefault();
      const i   = cells.findIndex(x => x.id === c.id);
      const nxt = cells[i+1];
      if (nxt) {
        nb.querySelector(`.cell-area[data-id="${nxt.id}"]`)?.focus();
      } else {
        addCell(c.id, true);
      }
      return;
    }
    // Ctrl+Enter → new cell below
    if (e.key === 'Enter' && e.ctrlKey) {
      e.preventDefault();
      addCell(c.id, true);
      return;
    }
    // Backspace on empty → delete
    if (e.key === 'Backspace' && ta.value === '' && cells.length > 1) {
      e.preventDefault();
      delCell(c.id);
      return;
    }
  });

  /* paste */
  ta.addEventListener('paste', e => {
    e.preventDefault();
    insertAt(ta, clean((e.clipboardData||window.clipboardData).getData('text')), c.id);
  });

  /* focus */
  ta.addEventListener('focus', () => {
    activeId = c.id;
    nb.querySelectorAll('.cell').forEach(el => el.classList.remove('active'));
    wrap.classList.add('active');
  });

  /* ── DRAG & DROP (pointer events) ── */
  handle.addEventListener('pointerdown', e => {
    e.preventDefault();
    startDrag(c.id, e);
  });

  return wrap;
}

/* ── DRAG ENGINE ── */
function startDrag(id, e) {
  dragId = id;
  const srcEl = nb.querySelector(`.cell[data-id="${id}"]`);
  if (!srcEl) return;

  srcEl.classList.add('dragging');
  document.body.style.cursor = 'grabbing';

  // ghost
  const ghost = srcEl.cloneNode(true);
  ghost.id = 'drag-ghost';
  ghost.style.cssText = `
    position:fixed;z-index:999;pointer-events:none;
    width:${srcEl.offsetWidth}px;opacity:.85;
    background:var(--bg);border:1px solid var(--bg3);
    border-radius:6px;box-shadow:0 8px 32px rgba(0,0,0,.5);
    transform:rotate(0.6deg);
    left:${e.clientX - 24}px;top:${e.clientY - 18}px;
    transition:none;
  `;
  document.body.appendChild(ghost);

  function onMove(ev) {
    ghost.style.left = (ev.clientX - 24) + 'px';
    ghost.style.top  = (ev.clientY - 18) + 'px';

    // find target cell
    let best = null, bestPos = null;
    nb.querySelectorAll('.cell:not(.dragging)').forEach(el => {
      const rect = el.getBoundingClientRect();
      const mid  = rect.top + rect.height / 2;
      if (ev.clientY >= rect.top - 6 && ev.clientY <= rect.bottom + 6) {
        best    = parseInt(el.dataset.id);
        bestPos = ev.clientY < mid ? 'above' : 'below';
      }
    });

    // clear old highlights
    nb.querySelectorAll('.cell').forEach(el => {
      el.classList.remove('drag-over-above','drag-over-below');
    });

    if (best !== null) {
      dragOverId = best;
      dragPos    = bestPos;
      const el   = nb.querySelector(`.cell[data-id="${best}"]`);
      if (el) el.classList.add('drag-over-' + bestPos);
    } else {
      dragOverId = null;
      dragPos    = null;
    }
  }

  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup',   onUp);

    ghost.remove();
    document.body.style.cursor = '';
    srcEl.classList.remove('dragging');
    nb.querySelectorAll('.cell').forEach(el => {
      el.classList.remove('drag-over-above','drag-over-below');
    });

    if (dragOverId !== null && dragOverId !== dragId) {
      const fromIdx = cells.findIndex(c => c.id === dragId);
      let   toIdx   = cells.findIndex(c => c.id === dragOverId);
      if (fromIdx === -1 || toIdx === -1) { dragId=null;dragOverId=null; return; }

      const [item] = cells.splice(fromIdx, 1);
      toIdx = cells.findIndex(c => c.id === dragOverId);
      const insert = dragPos === 'above' ? toIdx : toIdx + 1;
      cells.splice(insert, 0, item);
      renderAll();
      save();
      requestAnimationFrame(() => {
        nb.querySelector(`.cell-area[data-id="${dragId}"]`)?.focus();
      });
    }

    dragId = null; dragOverId = null; dragPos = null;
  }

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup',   onUp);
}

/* ── INSERT AT CURSOR ── */
function insertAt(ta, text, id) {
  const s = ta.selectionStart, en = ta.selectionEnd;
  ta.value = ta.value.slice(0,s) + text + ta.value.slice(en);
  ta.selectionStart = ta.selectionEnd = s + text.length;
  handleInput(ta, id);
}

/* ── GLOBAL KEYS ── */
document.addEventListener('keydown', e => {
  if (e.key === 'b' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'TEXTAREA') {
    addCell(activeId, true);
  }
});

/* ── UTILS ── */
function wordCount(text) {
  return text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
}
function updateCount() {
  const n = cells.length;
  countEl.textContent = n + ' cell' + (n !== 1 ? 's' : '');
  nb.querySelectorAll('.cell-num').forEach((el, i) => { el.textContent = `[${i+1}]`; });
  nb.querySelectorAll('.cell').forEach((el, i) => { el.dataset.accent = i % ACCENTS; });
  // per-cell word counts
  cells.forEach(c => {
    const wc = nb.querySelector(`.cell-wc[data-wc="${c.id}"]`);
    if (wc) wc.textContent = wordCount(c.content) + 'w';
  });
  // total word count
  const total = cells.reduce((sum, c) => sum + wordCount(c.content), 0);
  const twEl = document.getElementById('total-words');
  if (twEl) twEl.textContent = total + ' word' + (total !== 1 ? 's' : '');
}

function clearAll() {
  if (!confirm('wipe everything?')) return;
  cells = [{id:nextId++,content:''},{id:nextId++,content:''},{id:nextId++,content:''}];
  renderAll(); save();
}

function exportTxt() {
  const txt = cells.map((c,i) => `[${i+1}]\n${c.content||'(empty)'}`).join('\n\n');
  const a   = document.createElement('a');
  a.href    = URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download = 'chalk-export.txt';
  a.click();
}

/* ── BOOT ── */
load();
</script>
